name: compliance-gate

# The pipeline enforces policy on your environment. This gate enforces policy on the
# pipeline. No governance change merges without passing the same kind of scrutiny the
# pipeline applies to everything else.
#
#   static  — always runs, no cloud credentials: Tier 0 (fmt, validate, tflint,
#             checkov), gate unit tests, a PROOF that the gate blocks a known-bad plan,
#             report-logic tests, secret scan.
#   plan    — runs in an armed fork (scripts/arm-ci.sh): real `terraform plan` per
#             stage against the sandbox, then conftest on the plan JSON. Fails closed.
#
# Branch protection on main requires both: "static" and every "plan (<stage>)".

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  CONFTEST_VERSION: "0.62.0"

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans history

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive stages/

      - name: terraform validate (every stage, no backend)
        run: |
          for d in stages/*/; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@v6
      - name: tflint
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: checkov
        run: |
          pip install --quiet checkov
          checkov --config-file .checkov.yaml

      - name: install conftest
        run: |
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin conftest

      - name: gate unit tests (conftest verify)
        run: conftest verify -p policy

      - name: gate blocks a known-bad plan (must FAIL to pass)
        run: |
          # Public blob + shared keys + weak TLS + Contributor grant + identity-less
          # assignment + keyed Cosmos + open-ended exemption. Every rule must fire.
          if conftest test policy/fixtures/bad-plan.json -p policy --no-color > gate-proof.txt; then
            echo "::error::the gate PASSED a known-bad plan"; cat gate-proof.txt; exit 1
          fi
          cat gate-proof.txt
          fails=$(grep -c '^FAIL' gate-proof.txt)
          echo "gate blocked the bad plan with $fails named failures"
          [ "$fails" -ge 9 ] || { echo "::error::expected >= 9 failures, got $fails"; exit 1; }
          conftest test policy/fixtures/good-plan.json -p policy --no-color

      - name: report logic tests
        run: python3 -m unittest discover -s functions/reports/tests -v

      - name: secret scan (auto-fail trigger)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  plan:
    # Runs only in forks that have been armed (scripts/arm-ci.sh). The upstream
    # GRCEngClub/cgeaz repo is deliberately NOT armed: on a public repo, a
    # pull_request OIDC subject matches PRs from any fork — arming upstream would hand
    # fork PRs a path toward the course subscription. Your fork, your identity, your
    # sandbox subscription only. The CI identity is plan-only (custom role, no writes).
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    name: plan (${{ matrix.stage }})
    needs: static
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC federation — no client secret stored in GitHub, nothing to rotate
      contents: read
    strategy:
      fail-fast: false
      matrix:
        stage: [01-foundation, 02-activation, 03-evidence-store, 04-reporting, 06-enforcement]
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_state_storage_account: ${{ vars.STATE_STORAGE_ACCOUNT }}
      TF_VAR_owner_email: ${{ vars.OWNER_EMAIL }}
      TF_VAR_deployer_object_id: ${{ vars.DEPLOYER_OBJECT_ID }}
      TF_VAR_trusted_automation_callers: ${{ vars.TRUSTED_CALLERS || '[]' }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: backend config from repository variables
        # backend.hcl is machine-generated per operator and gitignored; CI rebuilds it.
        run: |
          cat > labs/03-foundation/backend.hcl <<EOF
          resource_group_name  = "rg-grc-tfstate"
          storage_account_name = "${{ vars.STATE_STORAGE_ACCOUNT }}"
          container_name       = "tfstate"
          EOF

      - name: terraform plan
        working-directory: stages/${{ matrix.stage }}
        run: |
          terraform init -input=false -backend-config=../../labs/03-foundation/backend.hcl
          # -lock=false: the CI identity is read-only by design and cannot take the
          # state lease. A plan never writes state, so there is nothing to protect.
          terraform plan -input=false -lock=false -out=tf.plan -no-color | tee plan.txt
          terraform show -json tf.plan > plan.json

      - name: install conftest
        run: |
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin conftest

      - name: OPA gate (conftest) — fails closed
        run: conftest test stages/${{ matrix.stage }}/plan.json -p policy --no-color

      - name: plan summary
        if: always()
        working-directory: stages/${{ matrix.stage }}
        run: |
          {
            echo "### ${{ matrix.stage }}"
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || echo "(no plan output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
